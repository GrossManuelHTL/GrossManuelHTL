<svg xmlns="http://www.w3.org/2000/svg" width="880" height="60" viewBox="0 0 880 60" role="img" aria-label="profile banner">
<title>profile banner</title>
<defs>
  <radialGradient id="glow" cx="100%" cy="0%" r="85%">
    <stop offset="0%" stop-color="#00a98c" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#00a98c" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  .card { fill: #ffffff; stroke: #d8dee4; }
  text { font-family: 'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
  .note { font-size: 10.5px; fill: #59636e; letter-spacing: .8px; text-transform: uppercase; }
  .num { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace; font-size: 21px; font-weight: 700; fill: #00a98c; }
  .lab { font-size: 10px; fill: #59636e; letter-spacing: .9px; text-transform: uppercase; }
  .lang { font-size: 12.5px; fill: #1f2328; }
  .pct { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace; font-size: 11.5px; fill: #59636e; }
  .rule { stroke: #d8dee4; }
  .grid { stroke: #d8dee4; stroke-dasharray: 2 4; }
  .axis { font-size: 9.5px; fill: #59636e; letter-spacing: .5px; }
  .foot { font-size: 11.5px; fill: #59636e; }
  .footv { font-size: 11.5px; font-weight: 600; fill: #00a98c; }
  .sep { fill: #d8dee4; }
  .peak { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace; font-size: 10px; font-weight: 700; fill: #00a98c; }
  .spark { stroke-dasharray: 4000; animation: draw 2.2s ease-out both; }
  @keyframes draw { from { stroke-dashoffset: 4000; } to { stroke-dashoffset: 0; } }
  .in { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .in, .bar, .spark, .fill { animation: none; } }
</style>
<rect width="880" height="60" fill="#ffffff"/>

<defs>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00a98c" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00a98c" stop-opacity=".8"/>
    <stop offset="100%" stop-color="#00a98c" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="0" y="18" width="880" height="2" fill="url(#rule)"/>
<text class="foot" x="440.0" y="46" text-anchor="middle">
  Every image on this page is regenerated nightly by a workflow in this repo.
</text>
</svg>
